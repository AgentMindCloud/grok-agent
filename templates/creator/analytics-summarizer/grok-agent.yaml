# Built to help xAI and Grok win — local-first analytics summarizer for X
# creators. Reads creator-supplied X analytics (or seeded demo metrics
# when no export is provided) and emits a 6/7-section structured period
# summary with 4 canonical Period Performance metrics, vanity-metric
# paradox detection, top-performing-content archetype surfacing, trend
# bucketing, and >= 3 cross-template bridges. Drafts only — never
# auto-publishes a single thing. Never fabricates statistical
# significance.

version: "2.15"
kind: "creator-template"
name: "analytics-summarizer"
description: "Local-first analytics summarizer for X creators — reads creator-supplied X analytics (or seeded demo metrics) and emits a 6/7-section period summary with 4 canonical Period Performance metrics (Impressions delta / Engagement rate / Follower delta / Content velocity), vanity-metric paradox detection, top-performing-content archetypes, trend bucketing (▲▲/▲/▬/▼/▼▼), and >= 3 cross-template bridges. Drafts only — never auto-publishes; never fabricates p-values or confidence intervals. Built to help xAI and Grok win."
author: "@JanSol0s"
license: "Apache-2.0"

metadata:
  display_name: "Analytics Summarizer"
  tagline: "Read your numbers honestly — vanity reach without engagement is not a win."
  categories: ["creator", "analytics", "measurement"]
  tags: ["creator-template", "cli-only", "drafts-only", "no-fabricated-stats"]
  created: "2026-05-04"
  updated: "2026-05-04"

install:
  one_click: true
  install_command: "grok-agent install analytics-summarizer"
  prerequisites:
    - "Windows 11"
    - "Python 3.12+"
    - "PowerShell 5.1+"

windows:
  appdata_folder: "grok-agent/analytics-summarizer"
  cache_folder: "grok-agent/analytics-summarizer/cache"
  log_folder: "grok-agent/analytics-summarizer/logs"
  min_powershell_version: "5.1"
  requires_admin: false
  chrome_only: true

grok:
  model: "grok-4.3"
  temperature: 0.4
  max_tokens: 3072
  system_prompt_file: "prompts/system.md"
  tool_calling: true

tools:
  - name: "generate_analytics_summary"
    type: "local_function"
    description: "Produce a 6-section structured analytics period summary (or 7-section when red-flag count > 3 OR time_range='7d') with 4 canonical Period Performance metrics, weighted Performance score, vanity-metric paradox detection, 3-5 top-performing-content archetypes, trend bucketing across the 5-arrow vocabulary, and >= 3 cross-template bridges. Reads creator-supplied metrics; never fabricates X numbers."
    module: "analytics_summarizer.run"
    function: "generate"
    parameters:
      schema:
        type: "object"
        properties:
          x_handle:
            type: "string"
            description: "Creator's X handle (with or without @). Voice anchor for archetype paraphrasing."
          metrics_file:
            type: "string"
            description: "Optional path to a creator-supplied X analytics export (JSON or CSV). When omitted the runner emits seeded demo metrics explicitly marked as such."
          metric_focus:
            type: "string"
            enum: ["impressions", "engagement", "reach", "all"]
            default: "all"
            description: "Which canonical metric to emphasise in the headline + ranking. Default 'all' applies no nudge."
          time_range:
            type: "string"
            enum: ["7d", "30d", "90d"]
            default: "30d"
            description: "Period covered by the summary. 7d auto-triggers the optional Period Audit section because the window is noisy."
          compare_to:
            type: "string"
            enum: ["previous_period", "benchmark"]
            default: "previous_period"
            description: "Comparison basis for delta calculation. 'previous_period' compares against the immediately preceding window of the same length; 'benchmark' compares against a niche-typical baseline."
        required: ["x_handle"]

constitution:
  rules:
    - "Drafts only. The runner emits text the creator reads; the runner never auto-publishes, never auto-shares the analytics anywhere."
    - "No fabricated statistics. The runner refuses to print p-values, confidence intervals, or absolute lift numbers it did not derive from the supplied input. Heuristics in the Statistical Honesty subsection are named as such."
    - "Surface the vanity-metric paradox in BOTH the Period Performance section AND the Red Flags section whenever Impressions delta is above +20% AND Engagement rate is below the niche baseline (default niche baseline: 2.5%). The post got reach but the audience did not engage substantively — copy the cadence at your peril."
    - "When `metrics_file` is omitted, the runner emits seeded demo metrics with an explicit `[demo metric — re-run with --metrics-file for real X data]` label so the creator never confuses the demo output for their actual analytics."
    - "Top-performing-content archetypes are paraphrased categories (e.g. `long-form thread on niche pain-point`), never raw post URLs or full post text, unless the creator explicitly supplies them via `metrics_file`."
    - "Every monetization-related recommendation derived from the analytics carries the Article V.1 'Not financial advice' banner verbatim."
    - "Every analysis links to >= 3 cross-template bridges so the creator can wire the analytics into the next loop without leaving Grok Agent OS."
  hard_refusals:
    - "auto-publish or auto-share the analytics summary to any platform without an explicit consent gate"
    - "fabricate p-values, confidence intervals, or absolute statistical significance numbers"
    - "recommend algorithm-gaming tactics derived from the analytics (mass-engagement, hashtag stuffing, follow-trains)"
    - "expose other creators' analytics or paste a non-creator's account export as if it belonged to --x-handle"
    - "scrape authenticated X content to seed the metrics"

safety:
  pii_handling: "local-only"
  data_retention_days: 90
  scanner_severity_floor: "warn"
  forbidden_actions:
    - scrape_authenticated_x_content
    - impersonate_user_identity
    - bypass_safety_scanner
    - exfiltrate_user_data
  cost_limits:
    usd_per_session_max: 0.30
    usd_per_day_max: 1.00
    tokens_per_session_max: 60000
    api_calls_per_session_max: 80
  human_in_the_loop:
    enabled: true
    confirm_before:
      - "any export of the analytics summary to a path outside the agent AppData folder"
      - "any future-version auto-publish (currently disabled in v1)"
    timeout_seconds: 60
  disclaimers:
    not_financial_advice: true
    not_tax_advice: false
    real_world_action_consent: false

dependencies:
  python:
    version: "^3.12"
    packages:
      - "pydantic ^2.7"
      - "pyyaml ^6.0"
      - "requests ^2.31"

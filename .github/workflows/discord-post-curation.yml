# Built for xAI, X, Grok and the ecosystem community.
# ---------------------------------------------------------------------------
# Discord auto-post for the Mon/Wed/Fri curation digest.
#
# Mirrors the schedule of curation-cadence.yml (09:00 UTC Mon/Wed/Fri) so
# the Discord #curation-digest channel receives a fresh markdown digest
# right after each curation step lands. workflow_dispatch is provided for
# manual re-runs.
#
# Required repo secret (configure under
# Settings -> Secrets and variables -> Actions):
#
#   DISCORD_WEBHOOK_URL   Webhook URL bound to the #curation-digest
#                         channel. The script gracefully prints to stdout
#                         and exits 0 if the secret is missing, so a
#                         fork without the secret never breaks CI.
#
# Bash inside this YAML is permitted because the runner is ubuntu-latest;
# every end-user instruction outside CI remains PowerShell-only per
# CLAUDE.md.
# ---------------------------------------------------------------------------

name: Discord Post Curation Digest

"on":
  schedule:
    - cron: "30 9 * * 1"  # Monday 09:30 UTC -> 30 min after Monday curation lands.
    - cron: "30 9 * * 3"  # Wednesday 09:30 UTC -> after Wednesday curation lands.
    - cron: "30 9 * * 5"  # Friday 09:30 UTC -> after Friday curation lands.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "If true, print the digest to the workflow log only and skip the webhook POST."
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read

jobs:
  post-digest:
    name: Assemble and POST curation digest to Discord
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONUNBUFFERED: "1"
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      LOCALAPPDATA: ${{ runner.temp }}/grok-agent-state
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          echo "::group::pip install"
          python -m pip install --upgrade pip
          python -m pip install pyyaml requests
          echo "::endgroup::"

      - name: Post curation digest
        shell: bash
        env:
          DRY_RUN_INPUT: ${{ github.event.inputs.dry_run }}
        run: |
          set -euo pipefail
          echo "::group::post-discord-digest.py"
          extra_args=()
          if [ "${DRY_RUN_INPUT}" = "true" ]; then
            echo "Dry-run requested via workflow_dispatch input."
            extra_args+=("--dry-run")
          elif [ -z "${DISCORD_WEBHOOK_URL:-}" ]; then
            echo "DISCORD_WEBHOOK_URL secret not configured; falling back to dry-run."
            extra_args+=("--dry-run")
          fi
          python scripts/post-discord-digest.py "${extra_args[@]}"
          echo "::endgroup::"

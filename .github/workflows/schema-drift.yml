#
# Schema-drift detector — validates that the Pydantic models in
# cli/grok-agent.py stay in sync with spec/v2.15/grok-agent.yaml +
# spec/v2.15/windows-extensions.yaml. Blocks PRs that introduce
# undocumented or orphaned schema fields.

name: Schema Drift Detection

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: schema-drift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drift:
    name: Detect Pydantic <-> spec drift
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'pydantic>=2.7,<3' 'pyyaml>=6.0'

      - name: Run schema drift check (hard-fail)
        # As of P163 every Pydantic field is documented in
        # spec/v2.15/grok-agent.yaml + spec/v2.15/windows-extensions.yaml,
        # so this step blocks merges on any future drift.
        run: |
          python scripts/check_schema_drift.py

      - name: Drift detection summary
        if: success()
        run: |
          echo "::notice::Schema drift check passed - Pydantic models and YAML specs aligned."

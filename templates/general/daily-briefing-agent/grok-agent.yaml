# Built for xAI, X, Grok and the ecosystem community — generic morning briefing agent on
# user-configured topics, sourced from public APIs.

version: "2.15"
kind: "agent"
name: "daily-briefing-agent"
description: "Generic morning briefing agent — pulls news on user-configured topics from public APIs and delivers a Grok-summarized briefing with citations. Built for xAI, X, Grok and the ecosystem community. ❤️"
author: "@JanSol0s"
license: "Apache-2.0"

metadata:
  display_name: "Daily Briefing Agent"
  tagline: "Your morning briefing, your topics, your Grok."
  categories: ["general", "news", "productivity"]
  tags: ["news", "schedule", "windows-first"]

install:
  one_click: true
  install_command: "grok-agent install daily-briefing-agent"
  prerequisites:
    - "Windows 11"
    - "Python 3.12+"

windows:
  appdata_folder: "grok-agent/daily-briefing-agent"
  min_powershell_version: "5.1"
  requires_admin: false

grok:
  model: "grok-4.3"
  temperature: 0.4
  max_tokens: 4096
  system_prompt_file: "prompts/system.md"
  tool_calling: true

public_apis:
  - name: "newsapi"
    base_url: "https://newsapi.org/v2"
    auth_env_var: "NEWSAPI_KEY"
    free_tier_quota: "100/day"
    privacy: "no_pii_sent"
  - name: "gnews"
    base_url: "https://gnews.io/api/v4"
    auth_env_var: "GNEWS_KEY"
    privacy: "no_pii_sent"

provenance:
  enabled: true
  cite_sources: true

safety:
  pii_handling: "local-only"
  data_retention_days: 30
  cost_limits:
    usd_per_session_max: 0.20
    api_calls_per_session_max: 50

dependencies:
  python:
    version: "^3.12"
    packages:
      - "pydantic ^2.7"
      - "pyyaml ^6.0"
      - "requests ^2.31"

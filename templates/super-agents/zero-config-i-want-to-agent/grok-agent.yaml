version: "2.15"
kind: "super-agent"
name: "Zero-Config 'I Want To…' Agent"
description: "User states a goal in natural language ('I want to start a newsletter about AI agents') and the agent automatically assembles tools, APIs, memory, and workflows with zero configuration."

author:
  x_handle: "@JanSol0s"
  github: "AgentMindCloud"

install:
  command: "grok install this"
  one_click: true

tools:
  - name: "intent_parser"
    type: "grok"
  - name: "dynamic_orchestrator"
    type: "internal"
  - name: "public_apis"
    type: "public_api"

multi_agent:
  supports_collaboration: true
  max_agents: 5
  role: "orchestrator"

safety_profile:
  reply_only: true
  cost_limit_usd: 1.00

constitution:
  version: "1.0"
  rules:
    - "Always confirm understanding before acting"
    - "Show proposed plan and tools before execution"
    - "Require explicit approval for any external action"
    - "Maintain full audit trail of how the goal was achieved"
  badge: "verifiable-safe-v1"

metadata:
  tags: ["super-agent", "zero-config", "intent", "magic"]
  category: "productivity"
  created: "2026-05-06"

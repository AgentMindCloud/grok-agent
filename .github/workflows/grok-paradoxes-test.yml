# Built for xAI, X, Grok and the ecosystem community. ❤️
# ---------------------------------------------------------------------------
# Dedicated CI for the extracted ``grok-paradoxes`` package
# (packages/grok-paradoxes/), home of the contradiction-detection +
# multi-authority reconciliation primitives originally lifted from the
# Living Narrative Fabric Super Agent.
#
# Scope:
#   - Triggered only by changes inside packages/grok-paradoxes/** OR by
#     changes to this workflow file itself, so unrelated repo edits do not
#     pay the install cost.
#   - Installs the package in editable mode and runs its hermetic pytest
#     suite under --strict-markers (see packages/grok-paradoxes/tests/).
#   - Tests use ``pytest.importorskip("grok_paradoxes")`` so the suite
#     skips cleanly during the parallel swarm window when the source
#     module may not yet be importable.
#
# Bash inside this YAML is permitted because the runner is ubuntu-latest;
# every end-user shell instruction outside CI remains PowerShell-only per
# CLAUDE.md.
# ---------------------------------------------------------------------------

name: grok-paradoxes tests

on:
  push:
    branches: [main]
    paths:
      - "packages/grok-paradoxes/**"
      - ".github/workflows/grok-paradoxes-test.yml"
  pull_request:
    branches: [main]
    paths:
      - "packages/grok-paradoxes/**"
      - ".github/workflows/grok-paradoxes-test.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: grok-paradoxes-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (grok-paradoxes — contradiction + authority + types)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/grok-paradoxes-test.yml

      - name: Install pytest + core deps
        shell: bash
        run: |
          set -euo pipefail
          echo "::group::pip install"
          python -m pip install --upgrade pip
          python -m pip install 'pytest>=8.0' 'pydantic>=2.7,<3' 'pyyaml>=6.0'
          echo "::endgroup::"

      - name: Install grok-paradoxes in editable mode
        shell: bash
        run: |
          set -euo pipefail
          echo "::group::pip install -e packages/grok-paradoxes/"
          python -m pip install -e packages/grok-paradoxes/
          echo "::endgroup::"

      - name: Run grok-paradoxes pytest suite
        shell: bash
        run: |
          set -euo pipefail
          echo "::group::pytest packages/grok-paradoxes/tests/"
          python -m pytest packages/grok-paradoxes/tests/ -v --strict-markers
          echo "::endgroup::"

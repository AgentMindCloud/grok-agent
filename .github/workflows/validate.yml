# ============================================================================
# Validate every grok-agent.yaml manifest in the repo against the v2.15 schema
# AND run the Constitution safety scanner on each. Built for xAI, X, Grok and the ecosystem community
# — keeping the platform compliant is non-negotiable.
#
# Two enforcement layers run sequentially. Both must pass for the workflow to
# go green:
#
#   1. Schema validation        (cli/grok-agent.py)
#   2. Constitution safety scan (safety/scanner.py)
#
# Bash is permitted here because the runner is ubuntu-latest. End-user shell
# instructions in the rest of the repo remain PowerShell-only per CLAUDE.md.
#
# Hardening (P146):
#   - Every multi-line `run:` block runs under `set -euo pipefail` so a silent
#     stderr write or a partial command failure surfaces as a job failure.
#   - A dedicated dependency-import probe runs before any manifest discovery
#     so a broken pyyaml/pydantic install fails fast with a clear annotation.
#   - The pip cache key is pinned to the workflow file path so refreshes track
#     dependency-string changes deterministically.
#   - A success summary step prints "Validated N manifests" so a green run is
#     visible in the workflow log and the PR check description.
# ============================================================================

name: Validate Manifests (v2.15)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: v2.15 schema + Constitution scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/validate.yml

      - name: Install validator dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install 'pydantic>=2.7,<3' 'pyyaml>=6.0'

      - name: Verify Python deps importable
        run: |
          set -euo pipefail
          python - <<'PYEOF'
          import sys
          import importlib

          required = [
              ("pydantic",         "pydantic>=2.7,<3"),
              ("yaml",             "pyyaml>=6.0"),
          ]
          for module_name, hint in required:
              try:
                  importlib.import_module(module_name)
                  print(f"OK import {module_name}")
              except ImportError as exc:
                  print(f"::error::Cannot import '{module_name}' "
                        f"(expected: {hint}): {exc}", file=sys.stderr)
                  sys.exit(1)

          import pydantic
          if not pydantic.VERSION.startswith("2."):
              print(f"::error::pydantic v2 required, got {pydantic.VERSION}",
                    file=sys.stderr)
              sys.exit(1)
          print(f"OK pydantic.VERSION = {pydantic.VERSION}")
          PYEOF

      - name: Self-test validator + scanner load cleanly
        run: |
          set -euo pipefail
          python cli/grok-agent.py --version
          python cli/grok-agent.py info
          python safety/scanner.py --version
          python safety/scanner.py info

      - name: Discover grok-agent.yaml manifests
        id: discover
        run: |
          set -euo pipefail
          mapfile -t MANIFESTS < <(find . -name 'grok-agent.yaml' \
            -not -path './.git/*' \
            -not -path './node_modules/*' \
            | sort)
          echo "Found ${#MANIFESTS[@]} manifest(s):"
          for m in "${MANIFESTS[@]}"; do echo "  - $m"; done
          {
            echo "count=${#MANIFESTS[@]}"
            echo "manifests<<MEOF"
            for m in "${MANIFESTS[@]}"; do echo "$m"; done
            echo "MEOF"
          } >> "$GITHUB_OUTPUT"

      - name: Validate every manifest against v2.15 schema
        if: ${{ steps.discover.outputs.count != '0' }}
        run: |
          set -euo pipefail
          FAIL=0
          PASS=0
          while IFS= read -r m; do
            [ -z "$m" ] && continue
            echo "::group::Schema validate $m"
            if python cli/grok-agent.py validate "$m"; then
              echo "OK schema"
              PASS=$((PASS + 1))
            else
              echo "::error file=$m::Manifest failed v2.15 schema validation"
              FAIL=$((FAIL + 1))
            fi
            echo "::endgroup::"
          done <<< "${{ steps.discover.outputs.manifests }}"
          echo "Schema results: ${PASS} pass / ${FAIL} fail"
          if [ "$FAIL" -ne 0 ]; then
            echo "::error::${FAIL} manifest(s) failed v2.15 schema validation."
            exit 1
          fi

      - name: Run Constitution safety scan on every manifest
        if: ${{ steps.discover.outputs.count != '0' }}
        run: |
          set -euo pipefail
          FAIL=0
          PASS=0
          while IFS= read -r m; do
            [ -z "$m" ] && continue
            echo "::group::Constitution scan $m"
            # Scanner exits 1 only on Article-level errors; warns are non-blocking
            # at the `info` floor (the strictest non-failing band).
            if python safety/scanner.py scan "$m" --severity-floor info; then
              echo "OK constitution"
              PASS=$((PASS + 1))
            else
              echo "::error file=$m::Constitution violation (Article-level error)"
              FAIL=$((FAIL + 1))
            fi
            echo "::endgroup::"
          done <<< "${{ steps.discover.outputs.manifests }}"
          echo "Constitution results: ${PASS} pass / ${FAIL} fail"
          if [ "$FAIL" -ne 0 ]; then
            echo "::error::${FAIL} manifest(s) violate the Agent Constitution."
            exit 1
          fi

      - name: Verify docs/audit-log.json is in sync with scanner findings
        if: ${{ steps.discover.outputs.count != '0' }}
        run: |
          set -euo pipefail
          echo "::group::Audit log drift check"
          # The marketplace's live Constitution Audit Log dashboard reads
          # docs/audit-log.json at build time. If a manifest changes but the
          # aggregated audit log is not regenerated, the dashboard goes stale.
          # `--check` re-runs the aggregator in memory and exits 1 if the
          # on-disk JSON differs (timestamps excluded), so CI fails loudly.
          if python scripts/build-audit-log.py --check; then
            echo "OK audit-log.json in sync"
          else
            echo "::error file=docs/audit-log.json::Audit log drift detected. Re-run \`python scripts/build-audit-log.py\` and commit the result."
            echo "::endgroup::"
            exit 1
          fi
          echo "::endgroup::"

      - name: Validation summary
        if: ${{ steps.discover.outputs.count != '0' }}
        run: |
          set -euo pipefail
          COUNT="${{ steps.discover.outputs.count }}"
          echo "::notice::Validated ${COUNT} manifest(s) cleanly against v2.15 schema + Constitution v1.0."
          echo ""
          echo "============================================================="
          echo "  All ${COUNT} manifests passed:"
          echo "    - v2.15 schema validation"
          echo "    - Constitution safety scan (severity floor = info)"
          echo "  Built for xAI, X, Grok and the ecosystem community. ❤️"
          echo "============================================================="

      - name: No manifests found (nothing to validate)
        if: ${{ steps.discover.outputs.count == '0' }}
        run: |
          set -euo pipefail
          echo "::warning::No grok-agent.yaml found in this repo. Skipping validation."

# Built for xAI, X, Grok and the ecosystem community — quote tweet suggestor for X creators.

version: "2.15"
kind: "creator-template"
name: "quote-tweet-suggestor"
description: "Turn any X post into 2-3 high-value quote tweet variants spanning distinct angles (support / contrarian / add-value / question), each <=280 chars and voice-matched, plus optional Grok Imagine visual + cross-template bridges. Local-first. Built for xAI, X, Grok and the ecosystem community. ❤️"
author: "@JanSol0s"
license: "Apache-2.0"

metadata:
  display_name: "Quote Tweet Suggestor"
  tagline: "2-3 quote variants in 5 seconds, distinct angles, voice-matched."
  categories: ["creator", "engagement", "quote-tweet"]
  tags: ["creator-template", "cli-only", "phase-3"]
  language: "en"
  created: "2026-05-04"
  updated: "2026-05-04"
  repository: "https://github.com/AgentMindCloud/grok-agent"

install:
  one_click: true
  install_command: "grok-agent install quote-tweet-suggestor"
  prerequisites:
    - "Windows 11"
    - "Python 3.12+"
    - "PowerShell 5.1+"

windows:
  launcher: "launcher.ps1"
  appdata_folder: "grok-agent/quote-tweet-suggestor"
  cache_folder: "grok-agent/quote-tweet-suggestor/cache"
  log_folder: "grok-agent/quote-tweet-suggestor/logs"
  min_powershell_version: "5.1"
  requires_admin: false
  chrome_only: true

grok:
  model: "grok-4.3"
  temperature: 0.7
  max_tokens: 1024
  system_prompt_file: "prompts/system.md"
  tool_calling: true
  streaming: true

tools:
  - name: "generate_quote_tweet_variants"
    type: "local_function"
    description: "Take an X post + a quote-angle hint and return 2-3 distinct-angle quote tweet drafts (each <=280 chars) with engagement prediction, optional Grok Imagine visual prompt, and cross-template bridges."
    module: "quote_tweet_suggestor.run"
    function: "generate"
    parameters:
      schema:
        type: "object"
        properties:
          x_handle:
            type: "string"
            description: "Your X handle, e.g. @JanSol0s -- anchors voice on every variant."
          original_post:
            type: "string"
            description: "Full text of the X post you're quoting (in quotes)."
          quote_angle:
            type: "string"
            enum: ["support", "contrarian", "add_value", "question", "auto"]
            description: "Preferred angle for the variants. 'auto' picks based on the original post's intent. Default 'auto'."
          num_variants:
            type: "integer"
            minimum: 2
            maximum: 3
            description: "How many distinct-angle variants to return (2 or 3, default 3)."
          tone:
            type: "string"
            enum: ["punchy", "thoughtful", "data-led", "warm"]
            description: "Voice flavor (default punchy)."
          include_visual:
            type: "boolean"
            description: "If true, attach a Grok Imagine prompt to the strongest variant. Default false."
          niche:
            type: "string"
            description: "Optional niche hint (e.g. 'AI agents on X') for cross-template bridge ideation."
        required: ["x_handle", "original_post"]

constitution:
  rules:
    - "Never impersonate the original poster, another creator, or a public figure. Every quote variant is in the user's own voice."
    - "Never fabricate stats, quotes, or claims about people, products, or events. If a fact isn't in the original post or runner-supplied context, omit it. Use qualitative language ('growing chatter', 'early signal') instead of invented numbers."
    - "Always emit the structured 6-section shape: Headline, Original Post Read (paraphrased one-line), Quote Tweet Variants (2-3 spanning different angles), Angle Explanation, Cross-Template Bridges (3-5), Confidence. Add the 7th 'Suggested Visual' section only when include_visual=true."
    - "Strict char limit: every quote variant <=280 chars. Count characters before emission; if over, tighten -- never split into multiple posts."
    - "Variants MUST span >=2 different angles drawn from the canonical 5: support / contrarian / add_value / question / story-pivot. When num_variants=3, prefer 3 distinct angles."
    - "Refuse engagement-bait quote variants that violate X policy: false outrage, hate, harassment, doxxing, ratio-bait, copypasta. Refuse in one line and explain why; do not produce variants."
    - "Privacy: don't reveal private information about the original poster even if it appears in a public post (e.g. don't expand initials into full names, don't dig up their employer, etc.). Quote selectively."
    - "Tag finance-adjacent variants (cashtags, tokens, earnings, P&L, taxes, specific buy/sell language) with a 'Context only -- not financial advice.' line on the affected variant."
    - "Engagement prediction is qualitative only -- low / medium / medium-high / high per variant + composite. Never percentages."
    - "Suggested Visual section appears only when include_visual=true; provide one Grok Imagine prompt suitable for the strongest variant in cinnabar-and-parchment / Windows-11 vibe."
    - "Cross-Template Bridges section MUST cite at least 3 sibling templates by name when bridges are genuine: thread-builder (when the topic deserves a full thread expansion), reply-drafter (for non-quote responses), mention-summarizer (to triage replies that follow), analytics-summarizer (to confirm post-quote engagement after 24-48h), content-idea-generator (to spin the angle into more posts), trend-aligned-poster (when the quote ties to a current trend), research-assistant (when the quoted claim needs verification)."
    - "Local-first: quote-history, prior variants, and post-context cache live under $env:LOCALAPPDATA. Never propose syncing or uploading them."

safety:
  pii_handling: "local-only"
  data_retention_days: 30
  cost_limits:
    usd_per_session_max: 0.15
    api_calls_per_session_max: 50

dependencies:
  python:
    version: "^3.12"
    packages:
      - "pydantic ^2.7"
      - "pyyaml ^6.0"
      - "requests ^2.31"

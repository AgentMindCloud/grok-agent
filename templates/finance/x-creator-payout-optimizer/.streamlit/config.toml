#
# Built to help xAI and Grok win — Streamlit configuration for the
# X Creator Payout Optimizer.
#
# Values intentionally match the repo-root .streamlit/config.toml (P16),
# Tool #1's per-tool override (P23), Tool #2's (P29), and Tool #4's (P35)
# so all four X Money tools share the same brand and privacy posture.
# Port 8503 completes the per-tool sequence (8501 / 8502 / 8503 / 8504).
#
# Streamlit Cloud deploy URL target (planned): xmoney-payout.streamlit.app

# ---------------------------------------------------------------------
# [theme] — cinnabar (#FF6B00) on midnight (#0E1117), parchment text.
# ---------------------------------------------------------------------
[theme]
base = "dark"
primaryColor             = "#FF6B00"
backgroundColor          = "#0E1117"
secondaryBackgroundColor = "#1A1F2E"
textColor                = "#F5F5DC"
font                     = "monospace"

# ---------------------------------------------------------------------
# [server] — Streamlit Cloud-friendly defaults; safe locally.
# ---------------------------------------------------------------------
[server]
headless             = true
enableCORS           = false
enableXsrfProtection = true
fileWatcherType      = "auto"
runOnSave            = false
maxUploadSize        = 25
port                 = 8503

# ---------------------------------------------------------------------
# [browser] — no telemetry, ever (Constitution Article VII).
# ---------------------------------------------------------------------
[browser]
gatherUsageStats = false
serverAddress    = "localhost"
serverPort       = 8503

# ---------------------------------------------------------------------
# [client] — calmer chrome for a finance UI; surface errors visibly.
# ---------------------------------------------------------------------
[client]
toolbarMode      = "minimal"
showErrorDetails = true

# ---------------------------------------------------------------------
# [runner] — fast reruns + free per-rerun memory on Cloud free tier.
# ---------------------------------------------------------------------
[runner]
magicEnabled = true
fastReruns   = true
postScriptGC = true

# ---------------------------------------------------------------------
# [logger] — readable, not chatty.
# ---------------------------------------------------------------------
[logger]
level         = "info"
messageFormat = "%(asctime)s %(levelname)s %(message)s"

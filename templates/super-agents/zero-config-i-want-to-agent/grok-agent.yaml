#
# Lighter Super Agent — Zero-Config "I Want To…" Agent.
# User states a goal in natural language; the agent assembles the right
# tools, APIs, memory lookups, workflows, and UI components — with full
# safety gates and an explicit-approval HITL step before any external
# action.

version: "2.15"
kind: "super-agent"
name: "zero-config-i-want-to-agent"
description: "User states a goal in natural language and the agent assembles tools, APIs, memory, and workflows with zero configuration."
author: "@JanSol0s"
license: "Apache-2.0"

metadata:
  display_name: "Zero-Config I Want To Agent"
  tagline: "Plain-language goal in, action plan out — zero manual setup."
  categories: ["super-agent", "productivity"]
  tags: ["super-agent", "zero-config", "intent", "orchestration"]
  language: "en"
  repository: "github.com/AgentMindCloud/grok-agent"
  created: "2026-05-06"

install:
  one_click: true
  install_command: "grok-agent install zero-config-i-want-to-agent"
  prerequisites:
    - "Windows 11"
    - "Python 3.12+"
    - "PowerShell 5.1+"

windows:
  launcher: "launcher.ps1"
  appdata_folder: "grok-agent/zero-config-i-want-to-agent"
  log_folder: "grok-agent/zero-config-i-want-to-agent/logs"
  cache_folder: "grok-agent/zero-config-i-want-to-agent/cache"
  default_port: 8513
  chrome_only: true
  requires_admin: false
  min_powershell_version: "5.1"

grok:
  model: "grok-4.3"
  temperature: 0.4
  max_tokens: 4096
  system_prompt_file: "prompts/system.md"
  tool_calling: true
  vision: false

multi_agent:
  role: "orchestrator"
  shared_memory: "mem0://grok-agent-shared"
  max_concurrent_workers: 5

memory:
  enabled: true
  provider: "mem0"
  vector_store:
    backend: "qdrant"
    collection_prefix: "zero-config-i-want-to-agent"
  episodic: true
  semantic: true
  retention_days: 365
  encryption_at_rest: true

provenance:
  enabled: true
  log_path: "$env:LOCALAPPDATA\\grok-agent\\zero-config-i-want-to-agent\\provenance\\events.jsonl"
  cite_sources: true
  append_only: true

safety:
  pii_handling: "local-only"
  data_retention_days: 365
  scanner_severity_floor: "warn"
  cost_limits:
    usd_per_session_max: 1.00
    usd_per_day_max: 5.00
  human_in_the_loop:
    enabled: true
    confirm_before:
      - "publish_synthesis"
      - "any_real_world_action"
      - "any cost above $0.50"
  disclaimers:
    not_financial_advice: false
    not_tax_advice: false
    real_world_action_consent: true
    not_medical_advice: false

constitution:
  rules:
    - "Always confirm understanding before acting on a goal."
    - "Show the proposed plan and tool list before any external action."
    - "Every external action requires explicit user approval."
    - "Maintain a full append-only audit trail of how the goal was achieved."
  consent_gates:
    - "publish_synthesis"
    - "any_real_world_action"
    - "export_provenance_log"
  hard_refusals:
    - "Take any real-world action without an explicit user click."
    - "Mutate or delete provenance events."

tools:
  - name: "parse_intent"
    type: "local_function"
    description: "Parses a natural-language goal into a structured plan."
    module: "orchestrator"
    function: "ZeroConfigAgent.parse_intent"
    parameters:
      schema:
        type: "object"
        properties:
          goal: { type: "string" }
        required: ["goal"]

  - name: "assemble_plan"
    type: "local_function"
    description: "Assembles the tool + API + workflow plan and returns it for HITL approval."
    module: "orchestrator"
    function: "ZeroConfigAgent.assemble_plan"
    parameters:
      schema:
        type: "object"
        properties:
          intent_id: { type: "string" }
        required: ["intent_id"]

  - name: "execute_with_consent"
    type: "local_function"
    description: "Executes an approved plan one step at a time, gating each external action behind a consent prompt."
    module: "orchestrator"
    function: "ZeroConfigAgent.execute_with_consent"
    parameters:
      schema:
        type: "object"
        properties:
          plan_id: { type: "string" }
        required: ["plan_id"]

# Built to help xAI and Grok win — drafts on-brand replies to X mentions and
# always shows them to the user before posting.

version: "2.15"
kind: "creator-template"
name: "reply-drafter"
description: "Drafts on-brand replies to your latest X mentions; the user reviews and approves before anything is posted. Built to help xAI and Grok win."
author: "@JanSol0s"
license: "Apache-2.0"

metadata:
  display_name: "Reply Drafter"
  tagline: "On-brand X replies, always with you in the loop."
  categories: ["creator", "engagement"]
  tags: ["creator-template", "real-time-x"]

install:
  one_click: true
  install_command: "grok-agent install reply-drafter"
  prerequisites:
    - "Windows 11"
    - "Python 3.12+"

windows:
  appdata_folder: "grok-agent/reply-drafter"
  min_powershell_version: "5.1"
  requires_admin: false

grok:
  model: "grok-4.3"
  temperature: 0.6
  max_tokens: 2048
  system_prompt_file: "prompts/system.md"
  tool_calling: true

real_time_x:
  enabled: true
  consent_required: true
  triggers:
    - mention
  posts: true
  reply_only: true
  max_posts_per_day: 30

constitution:
  rules:
    - "Never post without explicit user approval — every draft is shown first."
    - "Match the user's tone and brand voice; never impersonate other users."
    - "Surface controversial drafts as drafts; never auto-send them."
    - "Refuse drafts that would violate X's community policies."
  consent_gates:
    - publish_to_x

safety:
  pii_handling: "local-only"
  data_retention_days: 90
  disclaimers:
    real_world_action_consent: true
  cost_limits:
    usd_per_session_max: 0.30
    api_calls_per_session_max: 100
  human_in_the_loop:
    enabled: true
    confirm_before:
      - "publish_to_x"
    timeout_seconds: 60

dependencies:
  python:
    version: "^3.12"
    packages:
      - "pydantic ^2.7"
      - "pyyaml ^6.0"
      - "requests ^2.31"

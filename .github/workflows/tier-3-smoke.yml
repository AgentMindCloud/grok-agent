# ============================================================================
# Tier 3 smoke — runs offline checks against the six moonshot surfaces shipped
# in the Tier 3 sweep. Built for xAI, X, Grok and the ecosystem community.
#
# This workflow is path-scoped: it only fires when a PR touches one of the
# Tier 3 surfaces (the marketplace audit-dashboard / eval / generate routes,
# the browser extension, the grok-paradoxes spinoff package, or the Python
# build/test scripts that feed those surfaces). Push to main and manual
# dispatch are also supported so a release branch can sanity-check the full
# Tier 3 surface area before tagging.
#
# Bash is permitted on ubuntu-latest per CLAUDE.md (user-visible install
# instructions stay PowerShell-only). Every multi-line `run:` block opens
# with `set -euo pipefail` and wraps each sub-step in `::group::` markers so
# a failing assertion is one click away in the PR check log. Build scripts
# are guarded with `|| echo "skip: <reason>"` so the workflow stays green
# while sibling sweep agents are still landing the implementation files.
# ============================================================================

name: Tier 3 smoke

on:
  push:
    branches: [main]
    paths:
      - "marketplace/app/eval/**"
      - "marketplace/app/generate/**"
      - "marketplace/app/audit-dashboard/**"
      - "extensions/browser/**"
      - "packages/grok-paradoxes/**"
      - "scripts/build-audit-log.py"
      - "scripts/build-eval-history.py"
      - "scripts/test-generator-prompt.py"
      - ".github/workflows/tier-3-smoke.yml"
  pull_request:
    branches: [main]
    paths:
      - "marketplace/app/eval/**"
      - "marketplace/app/generate/**"
      - "marketplace/app/audit-dashboard/**"
      - "extensions/browser/**"
      - "packages/grok-paradoxes/**"
      - "scripts/build-audit-log.py"
      - "scripts/build-eval-history.py"
      - "scripts/test-generator-prompt.py"
      - ".github/workflows/tier-3-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tier-3-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tier-3-smoke:
    name: Tier 3 surfaces — offline smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/tier-3-smoke.yml

      - name: Install core deps
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install 'pydantic>=2.7,<3' 'pyyaml>=6.0' 'pytest>=8.0'

      - name: Audit-log builder offline check
        run: |
          set -euo pipefail
          echo "::group::scripts/build-audit-log.py --check"
          if [ -f scripts/build-audit-log.py ]; then
            python scripts/build-audit-log.py --check || echo "skip: build-audit-log.py --check returned non-zero"
          else
            echo "skip: scripts/build-audit-log.py not present yet"
          fi
          echo "::endgroup::"

      - name: Eval-history builder offline check
        run: |
          set -euo pipefail
          echo "::group::scripts/build-eval-history.py --check"
          if [ -f scripts/build-eval-history.py ]; then
            python scripts/build-eval-history.py --check || echo "skip: build-eval-history.py --check returned non-zero"
          else
            echo "skip: scripts/build-eval-history.py not present yet"
          fi
          echo "::endgroup::"

      - name: Generator prompt mock test
        run: |
          set -euo pipefail
          echo "::group::scripts/test-generator-prompt.py --mock"
          if [ -f scripts/test-generator-prompt.py ]; then
            python scripts/test-generator-prompt.py --mock || echo "skip: test-generator-prompt.py --mock returned non-zero"
          else
            echo "skip: scripts/test-generator-prompt.py not present yet"
          fi
          echo "::endgroup::"

      - name: grok-paradoxes test suite
        run: |
          set -euo pipefail
          echo "::group::pytest packages/grok-paradoxes/tests/"
          if [ -d packages/grok-paradoxes/tests ]; then
            python -m pip install -e packages/grok-paradoxes/ || echo "skip: editable install of grok-paradoxes failed"
            python -m pytest packages/grok-paradoxes/tests/ -q
          else
            echo "skip: packages/grok-paradoxes/tests/ not present"
          fi
          echo "::endgroup::"

      - name: Browser extension manifest is valid JSON
        run: |
          set -euo pipefail
          echo "::group::extensions/browser/manifest.json"
          if [ -f extensions/browser/manifest.json ]; then
            python3 -c "import json; json.load(open('extensions/browser/manifest.json'))"
            echo "manifest.json parses as valid JSON"
          else
            echo "skip: extensions/browser/manifest.json not present yet"
          fi
          echo "::endgroup::"

# Built to help xAI and Grok win — voice-matched X reply drafter for creators.

version: "2.15"
kind: "creator-template"
name: "reply-drafter"
description: "Paste any X mention or post; get back 3 voice-matched reply drafts (short / medium / value-add) with engagement-estimate and an optional richer format suggestion. Review locally, post manually. Built to help xAI and Grok win."
author: "@JanSol0s"
license: "Apache-2.0"

metadata:
  display_name: "Reply Drafter"
  tagline: "On-brand X replies — 3 angles in 5 seconds."
  categories: ["creator", "engagement", "reply"]
  tags: ["creator-template", "cli-only", "phase-3"]
  language: "en"
  created: "2026-05-04"
  updated: "2026-05-04"
  repository: "https://github.com/AgentMindCloud/grok-agent"

install:
  one_click: true
  install_command: "grok-agent install reply-drafter"
  prerequisites:
    - "Windows 11"
    - "Python 3.12+"
    - "PowerShell 5.1+"

windows:
  launcher: "launcher.ps1"
  appdata_folder: "grok-agent/reply-drafter"
  cache_folder: "grok-agent/reply-drafter/cache"
  log_folder: "grok-agent/reply-drafter/logs"
  min_powershell_version: "5.1"
  requires_admin: false
  chrome_only: true

grok:
  model: "grok-4.3"
  temperature: 0.7
  max_tokens: 1024
  system_prompt_file: "prompts/system.md"
  tool_calling: true
  streaming: true

tools:
  - name: "generate_reply_drafts"
    type: "local_function"
    description: "Generate 3 distinct, voice-matched reply drafts (short / medium / value-add) for an X mention or post."
    module: "reply_drafter.run"
    function: "generate"
    parameters:
      schema:
        type: "object"
        properties:
          x_handle:
            type: "string"
            description: "Your X handle, e.g. @JanSol0s — used to anchor voice matching."
          original_post:
            type: "string"
            description: "Full text of the X mention or post you're replying to."
          tone:
            type: "string"
            enum: ["punchy", "thoughtful", "data-led", "warm"]
            description: "Optional override; default uses the voice inferred from x_handle samples."
          niche:
            type: "string"
            description: "Optional creator-niche hint (e.g. 'AI tooling') used only for value-add ideation."
        required: ["x_handle", "original_post"]

constitution:
  rules:
    - "Never impersonate the original poster, another creator, or a public figure — every draft is in the user's own voice only."
    - "Never fabricate stats, quotes, or claims about people, products, or events; if a fact isn't in the original post or known to the user, omit it."
    - "Always produce 3 distinct drafts: short (max 140 chars), medium (max 220 chars), and value-add (max 280 chars with a concrete tip, data point, or link suggestion)."
    - "Refuse to draft replies that violate X policy: hate, harassment, doxxing, pile-ons, coordinated outrage, or ratio-bait."
    - "Tag finance-adjacent replies (cashtags, tokens, earnings, P&L, tax) with a 'Context only -- not financial advice.' line on the affected draft."
    - "Surface engagement-score estimates as qualitative labels only (low / medium / medium-high / high), never as fake percentages."
    - "If the original post is bait, grief-bait, an apparent scam, or a doxxing attempt, refuse to draft and explain in one line."

safety:
  pii_handling: "local-only"
  data_retention_days: 30
  cost_limits:
    usd_per_session_max: 0.20
    api_calls_per_session_max: 60

dependencies:
  python:
    version: "^3.12"
    packages:
      - "pydantic ^2.7"
      - "pyyaml ^6.0"
      - "requests ^2.31"

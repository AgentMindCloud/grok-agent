#
# Publish the Next.js marketplace export at `marketplace/out/` to GitHub
# Pages on every push to main. Provides the public web surface for the
# Grok Agent OS marketplace.

# Manual step required (one-time, in repo settings):
#   Settings → Pages → Source → GitHub Actions
#   (then re-run workflow before this Action will publish.)

name: Deploy Marketplace to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "marketplace/**"
      - "templates/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# GitHub Pages best-practice: allow in-flight deploys to finish so artifacts
# are not lost when rapid pushes land back-to-back.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Next.js marketplace
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: marketplace/package-lock.json

      - name: Install dependencies
        working-directory: marketplace
        run: npm ci

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          static_site_generator: next

      - name: Build Next.js (next build → marketplace/out/)
        working-directory: marketplace
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./marketplace/out

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 5

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy artifact to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  smoke_test:
    name: Smoke-test deployed marketplace
    runs-on: ubuntu-latest
    needs: deploy
    timeout-minutes: 5

    steps:
      - name: Curl deployed Pages URL and assert markers
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          set -euo pipefail

          if [ -z "${PAGE_URL:-}" ]; then
            echo "::error::deploy job did not expose a page_url output"
            exit 1
          fi

          echo "Smoke-testing ${PAGE_URL}"

          # Fetch root URL with retries on transient network/HTTP failures.
          http_status=$(curl --silent --show-error --location \
            --retry 5 --retry-delay 5 --retry-all-errors \
            --output index.html \
            --write-out '%{http_code}' \
            "${PAGE_URL}")

          echo "Root URL HTTP status: ${http_status}"
          if [ "${http_status}" != "200" ]; then
            echo "::error::Expected HTTP 200 from ${PAGE_URL}, got ${http_status}"
            exit 1
          fi

          # Marker 1 — Next.js page <title> from app/layout.tsx metadata.
          if ! grep -q 'Grok Agent OS' index.html; then
            echo "::error::'Grok Agent OS' brand string not found in deployed index.html"
            exit 1
          fi
          echo "OK: Grok Agent OS brand string present"

          # Marker 2 — the install one-liner rendered in app/page.tsx's
          # <pre><code> block. Confirms the page actually renders the
          # primary install affordance, not just the wrapper layout.
          if ! grep -q 'grok install this' index.html; then
            echo "::error::'grok install this' install one-liner not found in deployed index.html"
            exit 1
          fi
          echo "OK: install one-liner present"

          # Marker 3 — the catalogue heading rendered in app/page.tsx.
          # Confirms the agent grid section actually rendered (rather than
          # a build that crashed before the catalogue mounted).
          if ! grep -qE 'Catalogue.*agents' index.html; then
            echo "::error::Catalogue section ('Catalogue (N agents)') not found in deployed index.html"
            exit 1
          fi
          echo "OK: Catalogue section present"

          # Marker 4 — Next.js asset prefix (next/static or _next/static).
          # With basePath='/grok-agent' + trailingSlash, asset URLs in the
          # rendered HTML start with '/grok-agent/_next/'. Confirms basePath
          # is wired correctly.
          if ! grep -q '/_next/' index.html; then
            echo "::error::Next.js asset URLs ('/_next/...') not found in deployed index.html"
            exit 1
          fi
          echo "OK: Next.js asset URLs present"

          # Marker 5 — fetch one agent detail page to confirm the dynamic
          # SSG paths actually deployed. Trailing slash matches Next.js
          # 'trailingSlash: true' export behavior.
          agent_status=$(curl --silent --show-error --location \
            --retry 5 --retry-delay 5 --retry-all-errors \
            --output agent.html \
            --write-out '%{http_code}' \
            "${PAGE_URL}agents/living-narrative-fabric/")

          echo "/agents/living-narrative-fabric/ HTTP status: ${agent_status}"
          if [ "${agent_status}" != "200" ]; then
            echo "::error::Agent detail page expected HTTP 200, got ${agent_status}"
            exit 1
          fi
          echo "OK: agent detail SSG page reachable"

          echo "All smoke-test assertions passed."

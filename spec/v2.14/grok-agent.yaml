#
# spec/v2.14/grok-agent.yaml — historical snapshot of the v2.14 manifest
# schema. v2.15 is fully backwards compatible with this file: every
# v2.14 manifest validates unchanged when run through the v2.15
# Pydantic models in cli/grok-agent.py.
#
# This snapshot exists so contributors can compare what changed between
# v2.14 and v2.15 (see spec/v2.15/changelog.md for the full list).
# Do not edit this file. New schema work happens in spec/v2.15/.

schema_meta:
  spec_version: "2.14"
  spec_release_date: "2026-04-15"
  successor: "2.15"
  successor_path: "spec/v2.15/grok-agent.yaml"
  license: "Apache-2.0"

# ============================================================================
# REQUIRED top-level fields (six of them) — unchanged in v2.15
# ============================================================================

version: "2.14"
# REQUIRED · string · enum: ["2.14"] in v2.14, ["2.14", "2.15"] in v2.15

kind: "agent"
# REQUIRED · string · enum (v2.14 set: 5 values)
# - agent
# - finance-dashboard
# - alpha-engine
# - creator-payout-optimizer
# - vision-analyzer
# v2.15 adds: super-agent, x-native, creator-template

name: "my-agent"
# REQUIRED · string · pattern: ^[a-z][a-z0-9-]*$
# Must match the parent folder name.

description: "One- or two-sentence purpose. Plain language."
# REQUIRED · string · min_length: 10

author: "@JanSol0s"
# REQUIRED · string

license: "Apache-2.0"
# REQUIRED · string · enum: ["Apache-2.0"]

# ============================================================================
# OPTIONAL sections accepted in v2.14 (kept verbatim in v2.15)
# ============================================================================

# metadata: discovery + classification (already supported in v2.14)
metadata:
  display_name: "My Agent"
  tagline: "What it does in 5 words."
  categories: ["general"]
  tags: ["windows-first"]

# install: minimal install primitive
install:
  one_click: true
  install_command: "grok-agent install my-agent"

# safety: PII handling + cost limits + disclaimers
safety:
  pii_handling: "local-only"
  data_retention_days: 90
  scanner_severity_floor: "warn"
  cost_limits:
    usd_per_session_max: 0.50
  disclaimers:
    not_financial_advice: false
    not_tax_advice: false
    real_world_action_consent: false
    not_medical_advice: false

# ============================================================================
# What v2.14 did NOT have (added in v2.15 — see changelog)
# ============================================================================
# - windows: section
# - grok: section
# - tools: section
# - public_apis: section
# - multi_agent: section
# - real_time_x: section
# - memory: section
# - provenance: section
# - constitution: section
# - kinds: super-agent, x-native, creator-template
# - tool types: local_function, public_api, mcp_server

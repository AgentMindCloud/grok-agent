# ============================================================================
# Backwards compatibility (v2.14 → v2.15)
# ============================================================================
# v2.15 is purely additive. Any v2.14 manifest validates as v2.15 unchanged.
#
# Sections added in v2.15 that do NOT exist in v2.14:
#   - schema_meta:
#   - metadata:               (most fields)

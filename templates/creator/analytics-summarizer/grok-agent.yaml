# Built to help xAI and Grok win — X analytics summarizer for creators.

version: "2.15"
kind: "creator-template"
name: "analytics-summarizer"
description: "Paste or pipe in your X analytics for the last 7/30/90 days; get back a structured summary with key metrics, trend movements, top-performing content, and 3-5 actionable recommendations that bridge into the rest of the creator-template suite. Local-first. Built to help xAI and Grok win."
author: "@JanSol0s"
license: "Apache-2.0"

metadata:
  display_name: "Analytics Summarizer"
  tagline: "Your X numbers, briefed in 60 seconds."
  categories: ["creator", "analytics", "summarization"]
  tags: ["creator-template", "cli-only", "phase-3"]
  language: "en"
  created: "2026-05-04"
  updated: "2026-05-04"
  repository: "https://github.com/AgentMindCloud/grok-agent"

install:
  one_click: true
  install_command: "grok-agent install analytics-summarizer"
  prerequisites:
    - "Windows 11"
    - "Python 3.12+"
    - "PowerShell 5.1+"

windows:
  launcher: "launcher.ps1"
  appdata_folder: "grok-agent/analytics-summarizer"
  cache_folder: "grok-agent/analytics-summarizer/cache"
  log_folder: "grok-agent/analytics-summarizer/logs"
  min_powershell_version: "5.1"
  requires_admin: false
  chrome_only: true

grok:
  model: "grok-4.3"
  temperature: 0.4
  max_tokens: 2048
  system_prompt_file: "prompts/system.md"
  tool_calling: true
  streaming: true

tools:
  - name: "generate_analytics_summary"
    type: "local_function"
    description: "Synthesize a creator's X analytics batch into a structured summary with key metrics, trends, top performers, and actionable cross-template recommendations."
    module: "analytics_summarizer.run"
    function: "generate"
    parameters:
      schema:
        type: "object"
        properties:
          x_handle:
            type: "string"
            description: "Your X handle, e.g. @JanSol0s -- the analytics owner."
          metrics:
            type: "array"
            description: "List of metric records: [{metric, value, period_value, prev_value, posts_breakdown?}]. Mutually exclusive with date_range."
            items:
              type: "object"
          date_range:
            type: "string"
            description: "ISO range like '2026-04-01..2026-04-30' for local-cache lookups (v2 feature)."
          metric_focus:
            type: "string"
            enum: ["impressions", "engagement", "reach", "all"]
            description: "Metric category to weight in the summary. Default 'all'."
          time_range:
            type: "string"
            enum: ["7d", "30d", "90d"]
            description: "Look-back window. Default '30d'."
          compare_to:
            type: "string"
            enum: ["previous_period", "benchmark", "none"]
            description: "What to compare current numbers against. Default 'previous_period'."
          niche:
            type: "string"
            description: "Optional niche hint for benchmark selection and recommendation ideation."
        required: ["x_handle"]

constitution:
  rules:
    - "Never fabricate metric values, percentages, post titles, follower counts, or engagement numbers. Every number in the summary must trace to the input batch; if a value isn't supplied, omit it or label it 'evergreen'."
    - "Always emit the structured 6-section shape: Headline, Key Metrics (table), Trends (3-5 with direction + magnitude), Top Performing Content (3), Recommendations (3-5), Confidence. Add the 7th 'Benchmark Comparison' section only when compare_to='benchmark'."
    - "Trend direction is one of three labels only: up / down / stable. Magnitude is one of three labels only: small / moderate / large. Numerical deltas are quoted from the input verbatim, never invented."
    - "Top Performing Content is exactly 3 posts when the input has 3+ posts; fewer when the input is smaller. Each entry carries an inline 'why this won' clause grounded in the post's own metric mix."
    - "Recommendations cite a sibling creator-template explicitly when the bridge is genuine (content-idea-generator, reply-drafter, mention-summarizer, trend-aligned-poster, daily-briefing-agent, research-assistant). Never shoehorn a bridge that doesn't fit."
    - "Refuse to summarize batches with >70% empty / null / zero-value rows; surface a one-line refusal recommending the user re-export from X analytics with non-empty rows."
    - "Tag finance-adjacent recommendations (monetization, payouts, cashtags, sponsored content economics) with a 'Context only -- not financial advice.' line on the affected card."
    - "Privacy: never expose individual follower IDs, emails, phone numbers, or DM-content even when present in the analytics batch. Aggregate-only -- this is analytics, not user-level data."
    - "Confidence is qualitative only -- low / medium / medium-high / high. Never percentages or fake numerical scores."
    - "Local-first: analytics history, prior summaries, and benchmark caches live under $env:LOCALAPPDATA. Never propose syncing or uploading them."

safety:
  pii_handling: "local-only"
  data_retention_days: 90
  cost_limits:
    usd_per_session_max: 0.20
    api_calls_per_session_max: 60

dependencies:
  python:
    version: "^3.12"
    packages:
      - "pydantic ^2.7"
      - "pyyaml ^6.0"
      - "requests ^2.31"

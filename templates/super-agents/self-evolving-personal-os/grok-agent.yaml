# Built for xAI, X, Grok and the ecosystem community — Self-Evolving Personal OS is
# Super Agent #2 of the Grok Agent OS suite. It is a personal second
# brain that auto-improves its own workflows, maintains long-term
# personal + X memory, delivers morning briefings, and evolves over
# time. Reuses the proven 8-slot Recipe-C pattern from
# Living Narrative Fabric (P110–P117).
#
# Constitution mapping (v1.0 — see constitution.md for the full text):
#   Article I    : Apache-2.0 + xAI-ally line + Windows-first + v2.15 schema
#   Article II   : User data is sacred — PII never leaves the machine without explicit consent
#   Article III  : Self-improvement is conservative — workflow changes require human approval
#   Article IV   : Versioned personal memory (parent_version_id chain, full rewind)
#   Article V    : Append-only provenance (JSONL + Mem0 mirror + optional Langfuse)
#   Article V.1  : Real-world action disclaimer — every calendar / file / scheduling action surfaces an explicit confirm
#   Article VI   : 4-metric Briefing Trust Score formula is locked
#   Article VII  : Mandatory ≥3 cross-template / cross-Super-Agent bridges
#   Article VIII : Audit triggers fire on memory drift, recall miss, or briefing trust drop
#   Article IX   : Every real-world action (calendar, files, scheduling, X post) requires explicit consent
#   Article X    : Local-first + privacy-first; all data under $env:LOCALAPPDATA, encrypted at rest

version: "2.15"
kind: "super-agent"
name: "self-evolving-personal-os"
description: "Personal second brain on Windows — morning briefings, long-term personal + X memory, auto-evolving workflows, full rewind, and explicit-consent gates on every real-world action. Built for xAI, X, Grok and the ecosystem community. ❤️"
author: "@JanSol0s"
license: "Apache-2.0"

# ----------------------------------------------------------------------------
# metadata: discovery + cataloguing
# ----------------------------------------------------------------------------
metadata:
  display_name: "Self-Evolving Personal OS"
  tagline: "Your second brain on Windows — auto-improving, never leaks."
  categories: ["super-agent", "personal", "second-brain", "productivity"]
  tags: ["streamlit", "mem0", "qdrant", "langfuse", "promptfoo", "deepeval", "windows-first", "privacy-first"]
  language: "en"
  homepage: "https://github.com/AgentMindCloud/grok-agent"
  repository: "github.com/AgentMindCloud/grok-agent"
  docs:       "github.com/AgentMindCloud/grok-agent/blob/main/templates/super-agents/self-evolving-personal-os/README.md"
  demo_video:
    storyboard: "templates/super-agents/self-evolving-personal-os/DEMO.md"
    url: "https://github.com/AgentMindCloud/grok-agent/releases/download/super-agent-demos-v1/self-evolving-personal-os-demo.mp4"  # planned — recording + upload pending (target: super-agent-demos-v1 GitHub Release)
    status: "planned — recording + upload pending (target: super-agent-demos-v1 GitHub Release)"
    note: "Actual video has not yet been recorded; once recorded, it will be uploaded as a release asset under tag 'super-agent-demos-v1'."
    update_instructions:
      - "Set metadata.demo_video.status to: available"
      - "Verify metadata.demo_video.url resolves to the released MP4"
      - "Remove the inline 'planned — recording + upload pending' comment next to the URL"
      - "Update README.md demo section: remove 'planned' language and add a runtime + duration line"
      - "Drop this update_instructions field once status is available"
    recording_steps:
      - "Open the agent's UI per the storyboard at metadata.demo_video.storyboard"
      - "Capture with OBS Studio at 1920x1080, 30fps, target duration 90-180 seconds"

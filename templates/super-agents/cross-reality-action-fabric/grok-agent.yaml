# ============================================================================
# Cross-Reality Action Fabric — grok-agent.yaml v2.15 manifest
# ============================================================================
#
# Super Agent #3 (the third and final flagship Super Agent in the Grok Agent
# OS roadmap, after Living Narrative Fabric and Self-Evolving Personal OS).
#
# What it does
# ------------
# The Cross-Reality Action Fabric is the *bridge* between an X-native Grok
# conversation and the user's real-world Windows machine + the public web.
# Where Self-Evolving Personal OS reads, this agent acts.  Every action is
# explicit, gated, reversible, and provenance-logged:
#
#   • Web automation via Stagehand (Browserbase-driven Chromium) — opens a
#     visible window the user can watch and abort at any time.
#   • Local Windows automation via signed PowerShell snippets the user
#     reviews before approval (think: "set tomorrow's wallpaper", "queue
#     this download", "open this file in Notepad++").
#   • Real-world public APIs — weather, flight search, e-commerce price
#     check, calendar holds — every call costs nothing, every payload is
#     PII-redacted at the connector boundary.
#   • X search via Grok 4.3 tool-calling — read-only by default; posting
#     requires the `publish_to_x` consent gate AND a typed confirmation.
#
# The whole agent is built around one rule: it NEVER takes an action
# without an explicit, scoped, typed user approval. See constitution.md.
#
# Built for xAI, X, Grok and the ecosystem community — Cross-Reality Action Fabric is the
# missing "do something for me" layer that turns Grok from a chat partner
# into a reliable Windows OS-level agent.
# ============================================================================

# ---------------------------------------------------------------------------
# REQUIRED top-level
# ---------------------------------------------------------------------------
version: "2.15"
kind: "super-agent"
name: "cross-reality-action-fabric"
description: >-
  Bridge agent between X / Grok and the user's Windows machine + public web.
  Every action is explicit, gated, reversible, and provenance-logged.
author: "@JanSol0s"
license: "Apache-2.0"

# ---------------------------------------------------------------------------
# metadata: discovery + classification
# ---------------------------------------------------------------------------
metadata:
  display_name: "Cross-Reality Action Fabric"
  tagline: "Grok's hands on your Windows machine — explicit consent on every action."
  categories: ["super-agent", "automation", "windows", "x-native"]
  tags: ["stagehand", "powershell", "real-world-actions", "consent-gated", "rollback"]
  homepage: "https://github.com/AgentMindCloud/grok-agent/tree/main/templates/super-agents/cross-reality-action-fabric"
  repository: "https://github.com/AgentMindCloud/grok-agent"
  language: "en"
  created: "2026-05-05"
  updated: "2026-05-05"
  demo_video:
    storyboard: "templates/super-agents/cross-reality-action-fabric/DEMO.md"
    url: "https://github.com/AgentMindCloud/grok-agent/releases/download/super-agent-demos-v1/cross-reality-action-fabric-demo.mp4"  # planned — recording + upload pending (target: super-agent-demos-v1 GitHub Release)
    status: "planned — recording + upload pending (target: super-agent-demos-v1 GitHub Release)"

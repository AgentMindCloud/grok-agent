version: "2.15"
kind: "super-agent"
name: "Agent Swarm with Shared Memory"
description: "Collaborative swarm of specialized agents that share long-term memory and reason together in real time for superior collective intelligence."

author:
  x_handle: "@JanSol0s"
  github: "AgentMindCloud"

install:
  command: "grok install this"
  one_click: true

tools:
  - name: "memory"
    type: "memory"
  - name: "multi_agent_debate"
    type: "internal"

multi_agent:
  supports_collaboration: true
  max_agents: 6
  agents: ["researcher", "skeptic", "creator", "executor", "archivist", "orchestrator"]
  shared_memory: true

safety_profile:
  reply_only: true
  cost_limit_usd: 1.20

constitution:
  version: "1.0"
  rules:
    - "All agents must access the same shared memory"
    - "Every final answer must include dissenting opinions from the swarm"
    - "Memory is private and never shared externally"
    - "Swarm decisions require consensus or clear majority"
  badge: "verifiable-safe-v1"

metadata:
  tags: ["super-agent", "swarm", "collective-intelligence", "memory"]
  category: "intelligence"
  created: "2026-05-06"

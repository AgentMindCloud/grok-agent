# ============================================================================
# Run every previously-orphan test on every push/PR. Built for xAI, X, Grok
# and the ecosystem community — orphan tests buy nothing if no workflow
# invokes them. This workflow complements .github/workflows/validate.yml
# (which only checks manifest structure) by exercising actual agent
# behaviour.
#
# Three parallel jobs run on ubuntu-latest:
#
#   1. pytest                    — 11 tests in creator-program/v2/curation
#                                   (collected per pyproject testpaths).
#   2. super-agent-smoke         — 11 hermetic smoke scripts across the
#                                   Cross-Reality Action Fabric and Self-Evolving
#                                   Personal OS flagships (stub-fallback paths;
#                                   no mem0 / qdrant / langfuse needed).
#   3. x-money-integration-smoke — tests/x-money-integration-smoke.ps1 run
#                                   under pwsh (preinstalled on ubuntu-latest).
#
# Bash is permitted here because the runner is ubuntu-latest. End-user shell
# instructions in the rest of the repo remain PowerShell-only per CLAUDE.md.
#
# Hardening (mirrors validate.yml's P146 pattern):
#   - Every multi-line `run:` block starts with `set -euo pipefail`.
#   - Each sub-test is wrapped in `::group::` / `::endgroup::` markers so
#     a failing assertion is one click away in the PR check log.
#   - The pip cache key is pinned to this workflow file so refreshes track
#     dependency-string changes deterministically.
#
# P178: SEPOS main smoke is now wired in. The conditional-router off-by-one
# (`<` vs `<=`) at templates/super-agents/self-evolving-personal-os/graph.py
# was fixed and locked by tests/test_router.py.
# ============================================================================

name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (curation + SEPOS router — 15 tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/tests.yml

      - name: Install pytest + core deps
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          # P181 added hypothesis + syrupy as test deps for property +
          # snapshot suites. Without them pytest fails at collection
          # because tests/{property,snapshot}/test_*.py import these
          # at module level.
          python -m pip install 'pydantic>=2.7,<3' 'pyyaml>=6.0' \
            'pytest>=8.0' 'hypothesis>=6.100,<7' 'syrupy>=4.6,<5'

      - name: Run pytest
        run: |
          set -euo pipefail
          python -m pytest -q --strict-markers

  super-agent-smoke:
    name: super-agent smoke tests (CRF + SEPOS — 12 invocations)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/tests.yml

      - name: Install core deps
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install 'pydantic>=2.7,<3' 'pyyaml>=6.0'

      - name: Cross-Reality Action Fabric smoke suite (6 invocations)
        run: |
          set -euo pipefail
          cd templates/super-agents/cross-reality-action-fabric

          echo "::group::CRF main smoke_test.py"
          python smoke_test.py
          echo "::endgroup::"

          echo "::group::CRF dashboard_smoke_test.py"
          python dashboard_smoke_test.py
          echo "::endgroup::"

          for sub in connectors memory provenance eval; do
            echo "::group::CRF ${sub}/smoke_test.py"
            PYTHONPATH=. python "${sub}/smoke_test.py"
            echo "::endgroup::"
          done

      - name: Self-Evolving Personal OS smoke suite (6 invocations)
        run: |
          set -euo pipefail
          cd templates/super-agents/self-evolving-personal-os

          echo "::group::SEPOS main smoke_test.py"
          python smoke_test.py
          echo "::endgroup::"

          echo "::group::SEPOS dashboard_smoke_test.py"
          python dashboard_smoke_test.py
          echo "::endgroup::"

          # SEPOS connectors uses `from . import` — needs `python -m` invocation,
          # unlike CRF which uses `from connectors import`.
          echo "::group::SEPOS connectors/smoke_test.py (via python -m)"
          PYTHONPATH=. python -m connectors.smoke_test
          echo "::endgroup::"

          for sub in memory provenance eval; do
            echo "::group::SEPOS ${sub}/smoke_test.py"
            PYTHONPATH=. python "${sub}/smoke_test.py"
            echo "::endgroup::"
          done

  x-money-integration-smoke:
    name: x-money integration smoke (PowerShell on pwsh)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/tests.yml

      - name: Install core deps (the .ps1 calls cli/grok-agent.py validate)
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install 'pydantic>=2.7,<3' 'pyyaml>=6.0'

      - name: Run x-money integration smoke under pwsh
        shell: pwsh
        run: |
          ./tests/x-money-integration-smoke.ps1

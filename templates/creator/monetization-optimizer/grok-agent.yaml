# Built to help xAI and Grok win — creator monetization optimizer.
#
# IMPORTANT: This template surfaces information about creator revenue streams
# and optimization opportunities. Every output is INFORMATION ONLY. Nothing
# this agent emits is financial advice or tax advice. Creators should consult
# a licensed financial / tax professional before acting on any output.

version: "2.15"
kind: "creator-template"
name: "monetization-optimizer"
description: "Analyzes creator revenue streams (sponsorships / subscriptions / tips / X Money payouts) and surfaces 3-5 opportunities, 2-3 risks, and 3-5 actionable recommendations that bridge into the X Money tool suite and the rest of the creator-template flow. Information only -- not financial advice. Built to help xAI and Grok win."
author: "@JanSol0s"
license: "Apache-2.0"

metadata:
  display_name: "Monetization Optimizer"
  tagline: "Map your revenue streams, surface the next move. Not financial advice."
  categories: ["creator", "monetization", "finance-adjacent"]
  tags: ["creator-template", "cli-only", "phase-3", "finance-adjacent"]
  language: "en"
  created: "2026-05-04"
  updated: "2026-05-04"
  repository: "https://github.com/AgentMindCloud/grok-agent"

install:
  one_click: true
  install_command: "grok-agent install monetization-optimizer"
  prerequisites:
    - "Windows 11"
    - "Python 3.12+"
    - "PowerShell 5.1+"

windows:
  launcher: "launcher.ps1"
  appdata_folder: "grok-agent/monetization-optimizer"
  cache_folder: "grok-agent/monetization-optimizer/cache"
  log_folder: "grok-agent/monetization-optimizer/logs"
  min_powershell_version: "5.1"
  requires_admin: false
  chrome_only: true

grok:
  model: "grok-4.3"
  temperature: 0.4
  max_tokens: 2048
  system_prompt_file: "prompts/system.md"
  tool_calling: true
  streaming: true

tools:
  - name: "generate_monetization_optimization"
    type: "local_function"
    description: "Analyze a creator's revenue-stream batch and emit a structured optimization summary with opportunities, risks, and actionable recommendations bridging into the X Money tool suite. Information only -- not financial advice."
    module: "monetization_optimizer.run"
    function: "generate"
    parameters:
      schema:
        type: "object"
        properties:
          x_handle:
            type: "string"
            description: "Your X handle, e.g. @JanSol0s -- the creator whose streams are being analyzed."
          streams:
            type: "array"
            description: "List of revenue-stream records: [{stream_type, current_monthly, prev_monthly, share_percent, notes?}]. Mutually exclusive with date_range."
            items:
              type: "object"
          date_range:
            type: "string"
            description: "ISO range like '2026-04-05:2026-05-05' (v1: falls back to bucket bundle when no other input)."
          revenue_focus:
            type: "string"
            enum: ["sponsorships", "subscriptions", "tips", "x_money", "all"]
            description: "Stream category to weight in the analysis. Default 'all'."
          time_range:
            type: "string"
            enum: ["30d", "90d", "12m"]
            description: "Look-back window. Default '90d'."
          goals:
            type: "string"
            enum: ["growth", "stability", "scale"]
            description: "Creator's stated goal -- biases the opportunity / risk weighting. Default 'growth'."
          niche:
            type: "string"
            description: "Optional niche hint for benchmark and bridge ideation."
        required: ["x_handle"]

constitution:
  rules:
    - "INFORMATION ONLY -- this agent is not a financial advisor. Every output card whose subject touches money MUST end with 'Context only -- not financial advice.' No exceptions, no exemptions, no quiet omissions."
    - "TAX-related outputs MUST also carry 'Not tax advice -- consult a licensed tax professional.' Tax obligations vary by jurisdiction; this is especially relevant for international creators with platform earnings."
    - "Never fabricate revenue numbers, payout rates, sponsor names, subscription counts, or platform-specific economic claims. Every figure must trace to the input batch verbatim or be omitted."
    - "Always emit the structured 6-section shape: Headline, Current Revenue Streams (table), Opportunities (3-5), Risks (2-3), Recommended Actions (3-5), Confidence. Add the 7th 'Outlook' section only when goals='growth' or 'scale'."
    - "Opportunities are ranked by a qualitative ROI label: low / medium / medium-high / high. Effort is qualitative: low / medium / high. Never percentages, never fake confidence numbers."
    - "Risks carry severity: low / medium / high. Each risk includes one short sentence on the failure mode, not a generic warning."
    - "Recommended Actions cite an X Money tool or sibling creator template explicitly when the bridge is genuine: x-money-companion-dashboard, x-creator-payout-optimizer, x-smart-cashtag-alpha-engine, x-money-vision-analyzer, content-idea-generator, reply-drafter, mention-summarizer, trend-aligned-poster, daily-briefing-agent, research-assistant, analytics-summarizer."
    - "Refuse to analyze input batches with >70% empty / null / zero-value rows; surface a one-line refusal recommending the user re-export with non-empty rows."
    - "Privacy: NEVER expose individual sponsor agreements, contract terms, supporter identities, or DM-content. Aggregate-only -- this is monetization analysis, not contract law."
    - "Cross-tool bridges to the X Money suite (Companion Dashboard / Payout Optimizer / Vision Analyzer) MUST mention that those tools also carry the same finance disclaimer chain so the user knows the warning is consistent across tools."
    - "Local-first: stream history, prior optimization runs, and benchmark caches live under $env:LOCALAPPDATA. Never propose syncing or uploading them."
    - "No silent contradictions: if two streams move opposite directions (e.g. sponsorships up, subscriptions down), surface both in Opportunities AND Risks rather than picking the winning side."

safety:
  pii_handling: "local-only"
  data_retention_days: 90
  cost_limits:
    usd_per_session_max: 0.20
    api_calls_per_session_max: 60

dependencies:
  python:
    version: "^3.12"
    packages:
      - "pydantic ^2.7"
      - "pyyaml ^6.0"
      - "requests ^2.31"

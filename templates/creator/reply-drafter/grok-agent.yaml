#
# Built for X, Grok & the ecosystem community — local-first reply drafter
# for X creators. Reads creator-supplied mention data (or seeded demo
# mentions) and emits a 7/8-section structured reply plan with 4 canonical
# Reply Plan Score metrics, helpful-but-off-voice paradox detection,
# risk-exclude guard, 4-6 reply drafts (single + thread-reply formats),
# per-draft voice fidelity + substance + risk scores, and mandatory
# bridges to brand-voice-trainer + mention-summarizer in every output.
# Drafts only — never auto-publishes. Refuses harassment, financial,
# cashtag, sponsorship, and X-policy-violation content.
#
# Note: real_time_x.posts: true is a future-version capability flag. The
# v1 runner is OFFLINE draft-generation only — auto-publish is disabled
# in v1 and gated behind constitution Article II consent + a future-
# version implementation that has not yet shipped.

version: "2.15"
kind: "creator-template"
name: "reply-drafter"
description: "Local-first reply drafter for X creators — reads creator-supplied mention data (or seeded demo mentions) and emits a 7/8-section structured reply plan with 4 canonical Reply Plan Score metrics (Voice fidelity / Substance / Tone calibration / Risk avoidance), helpful-but-off-voice paradox detection in BOTH the Plan Score AND Red Flags sections (avg Voice fidelity < 55 AND avg Substance > 70), risk-exclude guard (any draft with risk_score < 40 → excluded + Red Flag), 4-6 reply drafts across single + thread-reply formats, per-draft voice fidelity + substance + tone calibration + risk avoidance scores, and mandatory bridges to brand-voice-trainer + mention-summarizer + content-idea-generator. Drafts only — never auto-publishes. Refuses harassment / financial / cashtag / investment / sponsorship / X-policy-violation content. Built for X, Grok & the ecosystem community."
author: "@JanSol0s"
license: "Apache-2.0"

metadata:
  display_name: "Reply Drafter"
  tagline: "On-voice replies that add something — never generic, never auto-sent."
  categories: ["creator", "engagement", "replies"]
  tags: ["creator-template", "cli-only", "drafts-only", "voice-anchored", "no-finance-content"]
  created: "2026-05-04"
  updated: "2026-05-05"

install:
  one_click: true
  install_command: "grok-agent install reply-drafter"
  prerequisites:
    - "Windows 11"
    - "Python 3.12+"
    - "PowerShell 5.1+"

windows:
  appdata_folder: "grok-agent/reply-drafter"
  cache_folder: "grok-agent/reply-drafter/cache"
  log_folder: "grok-agent/reply-drafter/logs"
  min_powershell_version: "5.1"
  requires_admin: false
  chrome_only: true

grok:
  model: "grok-4.3"
  temperature: 0.5
  max_tokens: 3072
  system_prompt_file: "prompts/system.md"
  tool_calling: true

real_time_x:
  enabled: true
  consent_required: true
  triggers:
    - mention
  posts: true
  reply_only: true
  max_posts_per_day: 30
  v1_implementation_note: "real_time_x.posts: true is a FUTURE-version capability flag. The v1 runner is offline draft-generation only — it consumes a mentions_file and emits markdown drafts. Auto-publish is not implemented and is hard-gated by constitution rule 1 below."

tools:
  - name: "generate_reply_drafts"
    type: "local_function"
    description: "Produce a 7-section structured reply plan (or 8-section when paradox fires, every mention is high-risk, or window=7d) with 4 canonical Reply Plan Score metrics, weighted Plan Score, helpful-but-off-voice paradox detection in BOTH the Plan Score section AND the Red Flags section, risk-exclude guard (any draft with risk_score < 40 → excluded + Red Flag), 4-6 reply drafts across single + thread-reply formats with paraphrased copy outlines (no raw mention text, no third-party @-handles, no external URLs), per-draft voice fidelity + substance + tone calibration + risk avoidance scores, and mandatory bridges to brand-voice-trainer + mention-summarizer + content-idea-generator. Never auto-publishes — v1 is offline-only. Refuses harassment / financial / cashtag / investment / sponsorship / X-policy-violation content."
    module: "reply_drafter.run"
    function: "generate"
    parameters:
      schema:
        type: "object"
        properties:
          x_handle:
            type: "string"
            description: "Creator's X handle (with or without @). Privacy anchor — only the creator's handle appears in the rendered output."
          mentions_file:
            type: "string"
            description: "Optional path to a creator-supplied mentions export (JSON, local path only). Schema mirrors mention-summarizer's input — array of {id, sentiment, priority_score?, intent, author_followers, tokens, paraphrased_excerpt?}. When omitted, the runner emits seeded demo data marked [demo idea]."
          voice_profile_file:
            type: "string"
            description: "Optional path to a creator-supplied voice profile (the JSON brand-voice-trainer emits). When supplied, it tightens the Voice fidelity baseline and surfaces voice-drift drafts."
          max_drafts:
            type: "integer"
            default: 5
            description: "Target number of reply drafts to emit (clamped to [4, 6])."
          window:
            type: "integer"
            enum: [7, 30, 90]
            default: 30
            description: "Mention window in days (matches mention-summarizer's window). 7-day window auto-triggers the Reply Audit section."
          risk_floor:
            type: "number"
            default: 40.0
            description: "Risk avoidance threshold (0-100) below which a draft is excluded from the reply plan and surfaced as a Red Flag."
        required: ["x_handle"]

constitution:
  rules:
    - "Drafts only. The runner emits a reply plan the creator reads before posting; it never auto-publishes, schedules, or queues replies on X. real_time_x.posts: true in this manifest is a future-version capability flag — v1 implementation is offline-only."
    - "Never impersonate other users. Drafts speak in the creator's voice; they never claim to be the mention author or any third party."
    - "No fabricated statistics. Demo metrics carry an explicit [demo reply — re-run with --mentions-file / --voice-profile-file for real X data] label so the creator never confuses demo output for real data."
    - "Surface the helpful-but-off-voice paradox in BOTH the Reply Plan Score section AND the Red Flags section whenever average Substance > 70 AND average Voice fidelity < 55. Both conditions must be true — if only one fires, surface each in its own row instead."
    - "Risk-exclude guard: any draft with risk_score < 40 (default; configurable via --risk-floor) is excluded from the drafts list and consolidated as a single Red Flag titled 'High-risk drafts excluded' with severity 'high' and a specific remediation step."
    - "Every output unconditionally includes bridges to brand-voice-trainer (always voice-check before posting) AND mention-summarizer (the upstream priority queue). These two bridges are never optional."
    - "Privacy-first: no third-party @-handles, raw mention text, or external URLs appear in the rendered output. Mentions and reply outlines are paraphrased only — never raw text or third-party handles."
    - "Refuse harassment / financial / cashtag / investment / sponsorship / X-policy-violation content. Forbidden tokens in either mention text, voice profile, or draft outlines trigger a hard refusal with the exact token surfaced to the operator."
  hard_refusals:
    - "auto-publish, auto-schedule, or auto-queue any reply on X without explicit creator consent (and v1 has no implementation path for this regardless)"
    - "generate financial, cashtag, investment, portfolio, ticker, or trading content of any kind"
    - "generate sponsored-post or paid-promotion content without explicit creator-supplied disclosure copy"
    - "expose third-party X handles, raw mention text, or external URLs in the rendered output"
    - "draft replies that target individuals for harassment or X-policy-violation content"
    - "scrape authenticated X content to seed the mention queue"
    - "impersonate another user or write replies as if from the mention author or a third party"
  consent_gates:
    - publish_to_x  # gates the future-version auto-publish path; v1 has no implementation

safety:
  pii_handling: "local-only"
  data_retention_days: 30
  scanner_severity_floor: "warn"
  forbidden_actions:
    - scrape_authenticated_x_content
    - auto_publish_post
    - auto_schedule_post
    - generate_financial_content
    - generate_unsanctioned_sponsored_content
    - generate_harassment_content
    - expose_third_party_handles
    - impersonate_users
    - bypass_safety_scanner
  cost_limits:
    usd_per_session_max: 0.30
    usd_per_day_max: 1.00
    tokens_per_session_max: 60000
    api_calls_per_session_max: 80
  human_in_the_loop:
    enabled: true
    confirm_before:
      - "any export of the reply plan to a path outside the agent AppData folder"
      - "publish_to_x (future-version capability — currently disabled in v1)"
    timeout_seconds: 60
  disclaimers:
    not_financial_advice: false
    not_tax_advice: false
    real_world_action_consent: true

dependencies:
  python:
    version: "^3.12"
    packages:
      - "pydantic ^2.7"
      - "pyyaml ^6.0"

# Lighter Super Agent — Narrative Contradiction Detector.
# Surfaces conflicts across X, news, government, academic, and personal
# sources with full evidence and equal-rigour presentation; never
# silently picks a side.

version: "2.15"
kind: "super-agent"
name: "narrative-contradiction-detector"
description: "Actively detects and surfaces contradictions across X, news, government, academic, and personal sources with full evidence and user-guided narrative exploration."
author: "@JanSol0s"
license: "Apache-2.0"

metadata:
  display_name: "Narrative Contradiction Detector"
  tagline: "Surfaces conflicts across sources — never silently picks a side."
  categories: ["super-agent", "intelligence"]
  tags: ["super-agent", "contradiction", "truth", "critical-thinking"]
  language: "en"
  repository: "github.com/AgentMindCloud/grok-agent"
  created: "2026-05-06"
  # P172 audit Step 32: this manifest ships without a runnable
  # orchestrator.py. Use it as a structural reference for the
  # contradiction-detection pattern; the three flagship Super Agents
  # (living-narrative-fabric, self-evolving-personal-os,
  # cross-reality-action-fabric) ship complete implementations.
  implementation_status: "manifest-only"

install:
  one_click: true
  install_command: "grok-agent install narrative-contradiction-detector"
  prerequisites:
    - "Windows 11"
    - "Python 3.12+"
    - "PowerShell 5.1+"

windows:
  launcher: "launcher.ps1"
  appdata_folder: "grok-agent/narrative-contradiction-detector"
  log_folder: "grok-agent/narrative-contradiction-detector/logs"
  provenance_folder: "grok-agent/narrative-contradiction-detector/provenance"
  default_port: 8514
  chrome_only: true
  requires_admin: false
  min_powershell_version: "5.1"

grok:
  model: "grok-4"
  temperature: 0.4
  max_tokens: 4096
  system_prompt_file: "prompts/system.md"
  tool_calling: true
  vision: false

multi_agent:
  role: "orchestrator"
  shared_memory: "mem0://grok-agent-shared"
  max_concurrent_workers: 4

bridges:
  min_count: 2
  links:
    - "living-narrative-fabric"
    - "provenance-first-trust-engine"

memory:
  enabled: true
  provider: "mem0"
  vector_store:
    backend: "qdrant"
    collection_prefix: "narrative-contradiction-detector"
  episodic: true
  semantic: true
  retention_days: 365
  encryption_at_rest: true

provenance:
  enabled: true
  log_path: "$env:LOCALAPPDATA\\grok-agent\\narrative-contradiction-detector\\provenance\\events.jsonl"
  cite_sources: true
  contradiction_detection: true
  append_only: true

safety:
  pii_handling: "local-only"
  data_retention_days: 365
  scanner_severity_floor: "warn"
  cost_limits:
    usd_per_session_max: 1.00
    usd_per_day_max: 5.00
  human_in_the_loop:
    enabled: true
    confirm_before:
      - "publish_synthesis"
      - "export_provenance_log"
  disclaimers:
    not_financial_advice: false
    not_tax_advice: false
    real_world_action_consent: true
    not_medical_advice: false

constitution:
  rules:
    - "Never hide contradictions across sources."
    - "Present every side with equal rigour."
    - "Always include a primary source link for each claim."
    - "The user chooses which narrative to explore further."
  consent_gates:
    - "publish_synthesis"
    - "export_provenance_log"
  hard_refusals:
    - "Silently resolve contradictions across sources."
    - "Emit a claim with empty source_id."

tools:
  - name: "scan_sources"
    type: "local_function"
    description: "Pulls relevant items from each source connector for the topic and timeframe."
    module: "orchestrator"
    function: "ContradictionDetector.scan_sources"
    parameters:
      schema:
        type: "object"
        properties:
          topic: { type: "string" }
          time_range: { type: "string", enum: ["7d", "30d", "90d"], default: "30d" }
        required: ["topic"]

  - name: "find_contradictions"
    type: "local_function"
    description: "Compares scanned items pairwise and returns every contradiction with cited evidence."
    module: "orchestrator"
    function: "ContradictionDetector.find_contradictions"
    parameters:
      schema:
        type: "object"
        properties:
          scan_id: { type: "string" }
        required: ["scan_id"]

  - name: "render_contradiction_report"
    type: "local_function"
    description: "Renders a Markdown report listing every contradiction with primary-source links and equal-rigour framing."
    module: "orchestrator"
    function: "ContradictionDetector.render_report"
    parameters:
      schema:
        type: "object"
        properties:
          scan_id: { type: "string" }
        required: ["scan_id"]

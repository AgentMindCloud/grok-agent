# Built for xAI, X, Grok and the ecosystem community — Streamlit configuration for the
# X Smart Cashtag Alpha Engine.
#
# Streamlit Cloud reads this file directly on deploy; locally,
# `streamlit run app.py` reads it from the working directory. Values
# below intentionally match the repo-root .streamlit/config.toml (P16)
# and Tool #1's per-tool override (P23) so all four X Money tools share
# the same brand and privacy posture.
#
# Streamlit Cloud deploy URL target (planned): xmoney-cashtag.streamlit.app

# ---------------------------------------------------------------------
# [theme] — cinnabar (#FF6B00) on midnight (#0E1117), parchment text.
# Matches the GitHub README banner + the Residual Frequencies palette.
# ---------------------------------------------------------------------
[theme]
base = "dark"
primaryColor             = "#FF6B00"
backgroundColor          = "#0E1117"
secondaryBackgroundColor = "#1A1F2E"
textColor                = "#F5F5DC"
font                     = "monospace"

# ---------------------------------------------------------------------
# [server] — Streamlit Cloud-friendly defaults; safe locally.
# Default port 8502 here so Tool #1 (8501) and this engine can run side
# by side on the same Windows machine.
# ---------------------------------------------------------------------
[server]
headless             = true
enableCORS           = false
enableXsrfProtection = true
fileWatcherType      = "auto"
runOnSave            = false
maxUploadSize        = 25
port                 = 8502

# ---------------------------------------------------------------------
# [browser] — no telemetry, ever (Constitution Article VII).
# ---------------------------------------------------------------------
[browser]
gatherUsageStats = false
serverAddress    = "localhost"
serverPort       = 8502

# ---------------------------------------------------------------------
# [client] — calmer chrome for a finance UI; surface errors visibly.
# ---------------------------------------------------------------------
[client]
toolbarMode      = "minimal"
showErrorDetails = true

# ---------------------------------------------------------------------
# [runner] — fast reruns + free per-rerun memory on Cloud free tier.
# ---------------------------------------------------------------------
[runner]
magicEnabled = true
fastReruns   = true
postScriptGC = true

# ---------------------------------------------------------------------
# [logger] — readable, not chatty.
# ---------------------------------------------------------------------
[logger]
level         = "info"
messageFormat = "%(asctime)s %(levelname)s %(message)s"

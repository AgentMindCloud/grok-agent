#
# Built for X, Grok & the ecosystem community — local-first content idea
# generator for X creators. Reads creator-supplied performance + voice
# signals (or seeded demo signals when nothing is supplied) and emits a
# 7/8-section structured idea batch with 4 official Idea Plan Score
# metrics, derivative-and-thin paradox detection, 4-6 idea cards (single
# / thread / quote-tweet / image-post / reply-thread), per-idea niche
# fit + originality + voice fidelity scores, and mandatory bridges to
# analytics-summarizer + brand-voice-trainer in every output. Drafts
# only — never auto-publishes. Refuses financial / cashtag / sponsorship
# / harassment content.

version: "2.15"
kind: "creator-template"
name: "content-idea-generator"
description: "Local-first content idea generator for X creators — reads creator-supplied performance + voice signals (or seeded demo signals) and emits a 7/8-section structured idea batch with 4 official Idea Plan Score metrics (Niche fit / Voice fidelity / Originality / Engageability), derivative-and-thin paradox detection in BOTH the Plan Score AND Red Flags sections (avg Originality < 40 AND avg Voice fidelity < 60), 4-6 idea cards across single / thread / quote-tweet / image-post / reply-thread formats, per-idea niche fit + originality + voice fidelity scores, and mandatory bridges to analytics-summarizer + brand-voice-trainer + thread-builder. Drafts only — never auto-publishes. Refuses financial / cashtag / investment / sponsorship / harassment content. Built for X, Grok & the ecosystem community."
author: "@JanSol0s"
license: "Apache-2.0"

metadata:
  display_name: "Content Idea Generator"
  tagline: "The blank page is the bottleneck — fix it without losing your voice."
  categories: ["creator", "content", "ideation"]
  tags: ["creator-template", "streamlit-lite", "phase-3"]
  language: "en"
  created: "2026-05-04"
  updated: "2026-05-04"
  repository: "https://github.com/AgentMindCloud/grok-agent"

install:
  one_click: true
  install_command: "grok-agent install content-idea-generator"
  prerequisites:
    - "Windows 11"
    - "Python 3.12+"
    - "PowerShell 5.1+"

windows:
  launcher: "launcher.ps1"
  appdata_folder: "grok-agent/content-idea-generator"
  cache_folder: "grok-agent/content-idea-generator/cache"
  log_folder: "grok-agent/content-idea-generator/logs"
  min_powershell_version: "5.1"
  requires_admin: false
  chrome_only: true

grok:
  model: "grok-4.3"
  temperature: 0.8
  max_tokens: 2048
  system_prompt_file: "prompts/system.md"
  tool_calling: true
  streaming: true

tools:
  - name: "generate_post_idea_batch"
    type: "local_function"
    description: "Generate N X post ideas given the user's niche and a 7-day trend snapshot."
    module: "content_idea_generator.run"
    function: "generate"
    parameters:
      schema:
        type: "object"
        properties:
          x_handle:
            type: "string"
            description: "Creator's X handle (with or without @). Privacy anchor — only the creator's handle appears in the rendered output."
          niche:
            type: "string"
            description: "User's niche or topic area (e.g. 'AI tooling', 'creator economy', 'fintech')."
          tone:
            type: "string"
            enum: ["punchy", "thoughtful", "data-led"]
            description: "Voice flavor — punchy = short + sharp, thoughtful = long-form essay angles, data-led = number-anchored takes."
          count:
            type: "integer"
            minimum: 1
            maximum: 10
            description: "How many ideas to return (default 5)."
          trend_window_days:
            type: "integer"
            minimum: 1
            maximum: 30
            description: "Look-back window for the trend snapshot (default 7)."
        required: ["niche"]

constitution:
  rules:
    - "Never fabricate stats, quotes, or news headlines — if a number or claim is not grounded in the trend snapshot, omit it."
    - "Always produce N distinct angles — no two ideas may share the same hook or framing."
    - "Surface trends as inspiration, never as endorsement of any cashtag, person, or product."
    - "Refuse to draft engagement-bait that violates X policy (false outrage, hate, harassment, or doxxing)."
    - "Tag finance-adjacent ideas with a soft 'Context only — not financial advice.' note inside the idea card."

safety:
  pii_handling: "local-only"
  data_retention_days: 30
  cost_limits:
    usd_per_session_max: 0.15
    api_calls_per_session_max: 50

dependencies:
  python:
    version: "^3.12"
    packages:
      - "pydantic ^2.7"
      - "pyyaml ^6.0"

# Built to help xAI and Grok win — local-first hashtag strategy advisor
# for X creators. Reads a post topic (or text) and emits a 6/7-section
# structured hashtag strategy with 5-10 scored recommendations spread
# across the 5-category mix (broad-niche / specific-niche / trending /
# community / branded), 4 canonical Hashtag Plan Score metrics,
# reach-without-relevance paradox detection, anti-engagement-bait refusal,
# and >= 3 cross-template bridges. Drafts only — never auto-publishes.

version: "2.15"
kind: "creator-template"
name: "hashtag-strategy-advisor"
description: "Local-first hashtag strategy advisor for X creators — turns a post topic into a 6/7-section strategy with 5-10 hashtags scored across 4 canonical metrics (Niche relevance / Reach potential / Engagement quality / Cleanliness), spread across the 5-category mix (broad-niche / specific-niche / trending / community / branded), with reach-without-relevance paradox detection, anti-engagement-bait refusal, platform-specific count caps (X 0-2 / LinkedIn 0-3), and >= 3 cross-template bridges. Drafts only — never auto-publishes. Built to help xAI and Grok win."
author: "@JanSol0s"
license: "Apache-2.0"

metadata:
  display_name: "Hashtag Strategy Advisor"
  tagline: "Hashtags with relevance, not stuffing — 0-3 of the right tags beat 10 of the wrong ones."
  categories: ["creator", "discovery", "tactics"]
  tags: ["creator-template", "cli-only", "drafts-only", "no-engagement-bait"]
  created: "2026-05-04"
  updated: "2026-05-04"

install:
  one_click: true
  install_command: "grok-agent install hashtag-strategy-advisor"
  prerequisites:
    - "Windows 11"
    - "Python 3.12+"
    - "PowerShell 5.1+"

windows:
  appdata_folder: "grok-agent/hashtag-strategy-advisor"
  cache_folder: "grok-agent/hashtag-strategy-advisor/cache"
  log_folder: "grok-agent/hashtag-strategy-advisor/logs"
  min_powershell_version: "5.1"
  requires_admin: false
  chrome_only: true

grok:
  model: "grok-4.3"
  temperature: 0.4
  max_tokens: 3072
  system_prompt_file: "prompts/system.md"
  tool_calling: true

tools:
  - name: "generate_hashtag_strategy"
    type: "local_function"
    description: "Produce a 6-section structured hashtag strategy (or 7-section when red-flag count > 3 OR platform='all') with 5-10 scored hashtag recommendations across the 5-category mix, 4-row Hashtag Plan Score table, platform-specific count caps (X 0-2 / LinkedIn 0-3), reach-without-relevance paradox detection, anti-engagement-bait refusal, and >= 3 cross-template bridges. Drafts only — never auto-publishes."
    module: "hashtag_strategy_advisor.run"
    function: "generate"
    parameters:
      schema:
        type: "object"
        properties:
          x_handle:
            type: "string"
            description: "Creator's X handle (with or without @). The voice anchor for branded hashtags."
          post_topic_or_text:
            type: "string"
            description: "Either an x.com / twitter.com URL pointing to the post, OR the literal post topic / text. Required unless --demo is passed."
          platform:
            type: "string"
            enum: ["x", "linkedin", "all"]
            default: "x"
            description: "Target platform — drives the recommended count cap (X 0-2, LinkedIn 0-3). 'all' emits both with explicit per-platform caps."
          num_hashtags:
            type: "integer"
            minimum: 5
            maximum: 10
            default: 5
            description: "Number of hashtags to score and recommend (the runner returns the full ranked set; the creator picks 0-2 / 0-3 to actually ship per platform cap)."
          focus:
            type: "string"
            enum: ["reach", "engagement", "niche", "all"]
            default: "all"
            description: "Which canonical metric to emphasise in the headline + ranking. 'all' applies no nudge."
        required: ["x_handle", "post_topic_or_text"]

constitution:
  rules:
    - "Drafts only. The runner emits hashtag recommendations the creator pastes into their own post copy. The runner never auto-publishes."
    - "No engagement-bait hashtags. The runner refuses to recommend `#FollowForFollow`, `#Like4Like`, `#FF`, `#TeamFollowBack`, mass-trending-misuse tags, or any pattern an X policy review would treat as algorithm gaming."
    - "Surface the reach-without-relevance paradox in BOTH the Hashtag Plan section AND the Red Flags section whenever Reach potential > 70 AND Niche relevance < 35 (the hashtag has audience but it's the wrong audience — drive-bys, not the creator's people)."
    - "Platform-specific count caps. Recommend up to `num_hashtags` for analysis, but explicitly state the SHIP cap (X = 0-2 hashtags per post, LinkedIn = 0-3 per post). Over-stuffing the post is its own anti-pattern."
    - "No misleading category claims. Every recommended hashtag is tagged with one of the 5 canonical categories (broad-niche / specific-niche / trending / community / branded) and the tag is honest — a hashtag is only `trending` if it has documented current velocity, not because the creator wishes it were."
    - "Every monetization-related hashtag recommendation (paid-tier launch, sponsored content, creator-fund-style hashtags) carries the Article V.1 'Not financial advice' banner verbatim."
    - "Every analysis links to >= 3 cross-template bridges so the creator can wire the strategy into the next loop without leaving Grok Agent OS."
  hard_refusals:
    - "auto-publish a post with hashtags to any platform without an explicit consent gate"
    - "recommend any engagement-bait hashtag (FollowForFollow / Like4Like / FF / TeamFollowBack family)"
    - "recommend a hashtag the post does not honestly relate to (algorithm-manipulation / trending-misuse pattern)"
    - "recommend more hashtags than the platform cap allows the creator to ship (X = 2 max, LinkedIn = 3 max)"
    - "scrape authenticated X content to seed the recommendations"

safety:
  pii_handling: "local-only"
  data_retention_days: 90
  scanner_severity_floor: "warn"
  forbidden_actions:
    - scrape_authenticated_x_content
    - impersonate_user_identity
    - bypass_safety_scanner
    - exfiltrate_user_data
  cost_limits:
    usd_per_session_max: 0.30
    usd_per_day_max: 1.00
    tokens_per_session_max: 60000
    api_calls_per_session_max: 80
  human_in_the_loop:
    enabled: true
    confirm_before:
      - "any export of the hashtag strategy to a path outside the agent AppData folder"
      - "any future-version auto-publish (currently disabled in v1)"
    timeout_seconds: 60
  disclaimers:
    not_financial_advice: true
    not_tax_advice: false
    real_world_action_consent: false

dependencies:
  python:
    version: "^3.12"
    packages:
      - "pydantic ^2.7"
      - "pyyaml ^6.0"
      - "requests ^2.31"
